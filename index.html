<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Coffee | Кофейня</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo">Craft<span>Coffee</span></div>
        <nav class="nav-links">
            <a href="#home">Главная</a>
            <a href="#menu">Меню</a>
        </nav>
        <div class="nav-actions" style="display: flex; align-items: center; gap: 1rem;">
            <button id="cart-btn" class="cart-btn">
                Корзина <span id="cart-count" class="badge">0</span>
            </button>
            <button id="login-btn" class="btn-primary">Войти</button>
            <button id="logout-btn" class="btn-primary" style="display: none; background: #666;">Выйти</button>
        </div>
    </header>

    <main>
        <section id="home" class="hero">
            <div class="hero-content">
                <h1>Настоящий кофе ручной работы</h1>
                <p>Отборные зерна, уникальная обжарка и любовь в каждой чашке.</p>
                <a href="#menu" class="btn-primary">Смотреть меню</a>
            </div>
        </section>

        <section id="menu" class="menu-section">
            <h2>Наше меню</h2>
            <div class="filters">
                <button class="filter-btn active" data-category="all">Всё</button>
                <button class="filter-btn" data-category="coffee">Кофе</button>
                <button class="filter-btn" data-category="dessert">Десерты</button>
            </div>
            <div id="products-grid" class="products-grid">
                <!-- Карточки товаров -->
            </div>
        </section>
    </main>

    <!-- Шторка корзины -->
    <div id="cart-overlay" class="cart-overlay"></div>
    <div id="cart-sidebar" class="cart-sidebar">
        <div class="cart-header">
            <h3>Ваш заказ</h3>
            <button id="close-cart" class="close-btn">&times;</button>
        </div>
        <div id="cart-items" class="cart-items">
            <!-- Элементы корзины -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Итого:</span>
                <span id="total-price">0 ₸</span>
            </div>
            <button class="btn-primary w-100" id="checkout-btn">Оформить заказ</button>
        </div>
    </div>

    <!-- Модальное окно авторизации -->
    <div id="auth-overlay" class="cart-overlay"></div>
    <div id="auth-modal" class="auth-modal">
        <div class="auth-header">
            <h3 id="auth-title">Вход</h3>
            <button id="close-auth" class="close-btn">&times;</button>
        </div>
        <form id="auth-form" class="auth-form">
            <input type="email" id="auth-email" placeholder="Email" required>
            
            <div class="password-wrapper">
                <input type="password" id="auth-password" placeholder="Пароль" required minlength="6">
                <button type="button" id="toggle-password" class="toggle-password-btn">👁️</button>
            </div>
            
            <button type="submit" class="btn-primary w-100" id="auth-submit">Войти</button>
            
            <div class="auth-divider"><span>или</span></div>
            
            <button type="button" class="btn-google w-100" id="google-login-btn">
                <svg width="18" height="18" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Войти через Google
            </button>
        </form>
        <div class="auth-footer">
            <span id="auth-toggle-text">Нет аккаунта?</span>
            <button id="auth-toggle-btn">Зарегистрироваться</button>
        </div>
    </div>

    <!-- Уведомления -->
    <div id="toast-container" class="toast-container"></div>

    <script type="module" src="script.js"></script>
</body>
</html>
