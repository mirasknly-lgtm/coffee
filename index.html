<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blend & Brew | Кофейня</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="script.js"></script>
</head>
<body>
    <!-- Навигация -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo">Blend & Brew.</div>
            <div class="nav-actions">
                <button class="auth-btn" id="btn-login">Войти</button>
                <button class="cart-btn" id="btn-cart">
                    🛒 Корзина <span class="cart-badge" id="cart-count">0</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Главный баннер -->
    <header class="hero">
        <div class="hero-content">
            <h1>Идеальный кофе и десерты</h1>
            <p>Свежая обжарка и выпечка с доставкой до вашей двери</p>
        </div>
    </header>

    <!-- Каталог -->
    <main class="main-container">
        <h2 class="section-title">Наше меню</h2>
        <div class="catalog-grid" id="catalog-container">
            <!-- Сюда JS загрузит товары -->
        </div>
    </main>

    <!-- Затемнение фона (одно для всех окон) -->
    <div class="overlay" id="global-overlay"></div>

    <!-- Модальное окно авторизации -->
    <div class="modal-auth" id="modal-auth">
        <div class="modal-header">
            <h2>Вход в аккаунт</h2>
            <button class="btn-close" id="close-auth">×</button>
        </div>
        <form class="auth-form" id="auth-form">
            <input type="email" placeholder="Email" required class="input-field">
            <input type="password" placeholder="Пароль" required class="input-field">
            <button type="submit" class="btn-primary">Войти</button>
        </form>
    </div>

    <!-- Боковая панель корзины -->
    <aside class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Ваш заказ</h2>
            <button class="btn-close" id="close-cart">×</button>
        </div>
        <div class="cart-body" id="cart-items">
            <p class="empty-msg">Ваша корзина пуста</p>
        </div>
        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Итого:</span>
                <strong id="cart-total-price">0 ₸</strong>
            </div>
            <button class="btn-primary btn-full" id="btn-checkout">Оформить заказ</button>
        </div>
    </aside>
</body>
</html>
